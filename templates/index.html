<!DOCTYPE html>
<!-- Updated to support linked list data structure from app.py -->

<html>
<head>
    <title>{{ title }} - Contact Manager</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>{{ title }}Contact Manager</h1>
    
    <div style="background-color: #f0f0f0; padding: 15px;">
        <h3>Add New Contact</h3>
        <form action="/add" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <button type="submit">Add to Data Structure</button>
        </form>
    </div>
    <div style="background:#e9f5ff;padding:15px;margin-top:15px;border-radius:6px;">
        <h3>Search Contacts</h3>
        <input id="search-input" type="search" placeholder="Start typing a name or email" style="width:100%;padding:8px;margin-top:8px;border:1px solid #ccc;border-radius:4px;">
        <p id="search-feedback" style="margin-top:8px;color:#555;display:none;"></p>
    </div>
    <hr>
    <h3>Current Contacts (In-Memory)</h3>
    <div id="contacts-container">
    {% for contact in contacts %}
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong>{{ contact.name }}</strong> - {{ contact.email }}
            </div>
            <form action="/delete/{{ contact.email | urlencode }}" method="POST" style="margin: 0;" onsubmit="return confirm('Are you sure you want to delete this contact?');">
                <button type="submit" style="background-color: #ff4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px;">Delete</button>
            </form>
        </div>
    {% else %}
        <div class="card">
            <em>No contacts found.</em>
        </div>
    {% endfor %}
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const contactsContainer = document.getElementById('contacts-container');
            const feedback = document.getElementById('search-feedback');
            let debounce;

            const renderContacts = (items, query = '') => {
                if (!items.length) {
                    const message = query ? `No contacts match "${query}".` : 'No contacts match your search yet.';
                    contactsContainer.innerHTML = `
                        <div class="card">
                            <em>${message}</em>
                        </div>
                    `;
                    return;
                }

                contactsContainer.innerHTML = items.map(item => `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>${item.name}</strong> - ${item.email}
                        </div>
                        <form action="/delete/${encodeURIComponent(item.email)}" method="POST" style="margin: 0;" onsubmit="return confirm('Are you sure you want to delete this contact?');">
                            <button type="submit" style="background-color: #ff4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px;">Delete</button>
                        </form>
                    </div>
                `).join('');
            };

            const handleSearch = () => {
                const query = searchInput.value.trim();

                fetch(`/search?q=${encodeURIComponent(query)}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        renderContacts(data.results, query);
                        if (query && !data.results.length) {
                            feedback.textContent = `No matches found for "${query}".`;
                            feedback.style.display = 'block';
                        } else if (!query && !data.results.length) {
                            feedback.textContent = 'No contacts available yet.';
                            feedback.style.display = 'block';
                        } else {
                            feedback.style.display = 'none';
                        }
                    })
                    .catch(() => {
                        feedback.textContent = 'Unable to reach the search service.';
                        feedback.style.display = 'block';
                    });
            };

            searchInput.addEventListener('input', () => {
                clearTimeout(debounce);
                debounce = setTimeout(handleSearch, 120);
            });
        });
    </script>
</body>
</html>
